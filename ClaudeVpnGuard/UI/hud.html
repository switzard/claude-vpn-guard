<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guard HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="hud.css" />
</head>
<body>
  <div class="hud" id="hud">
    <header class="bar" id="drag">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <strong>Guard HUD</strong>
      </div>
      <button type="button" id="btnClose" aria-label="Скрыть HUD" title="Скрыть (не отключает)">×</button>
    </header>
    <div class="row">
      <span class="pill pass-lead" id="pass">—</span>
      <span class="pill dim" id="vpn">VPN —</span>
      <span class="pill dim" id="claude">Claude —</span>
    </div>
    <div class="sum" id="sum">—</div>
    <div class="incident" id="incident" hidden></div>
    <div class="actions">
      <button type="button" id="btnCheck">Проверить VPN</button>
      <button type="button" id="btnAllow">15 мин (риск)</button>
      <button type="button" id="btnAck">Подтвердить</button>
      <button type="button" id="btnMain">Открыть</button>
    </div>
  </div>
  <script src="hud.js"></script>
</body>
</html>
